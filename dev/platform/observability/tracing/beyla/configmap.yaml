apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: tracing
  labels:
    app.kubernetes.io/name: beyla
data:
  beyla-config.yml: |
    # Day 51: auto-instrument cloudops-dev HTTP workloads → OTLP → Collector → Tempo
    attributes:
      kubernetes:
        enable: true
    discovery:
      instrument:
        - k8s_namespace: cloudops-dev
    routes:
      unmatched: heuristic
