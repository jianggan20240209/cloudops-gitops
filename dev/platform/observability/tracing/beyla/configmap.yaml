apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: tracing
  labels:
    app.kubernetes.io/name: beyla
data:
  beyla-config.yml: |
    # Day 51 / Beyla 2.0.4: key is discovery.services (not discovery.instrument)
    attributes:
      kubernetes:
        enable: true
    discovery:
      services:
        - k8s_namespace: cloudops-dev
    routes:
      unmatched: heuristic
