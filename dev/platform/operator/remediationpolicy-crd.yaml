apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationpolicies.cloudops.jianggan.cn
  labels:
    app.kubernetes.io/part-of: cloudops
spec:
  group: cloudops.jianggan.cn
  scope: Namespaced
  names:
    plural: remediationpolicies
    singular: remediationpolicy
    kind: RemediationPolicy
    shortNames:
      - rpol
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                match:
                  type: object
                  properties:
                    alertname:
                      type: string
                    namespace:
                      type: string
                    reason:
                      type: string
                      description: CrashLoopBackOff|OOMKilled|InsufficientReplicas
                actions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [RestartPod, ScaleUp, Rollback, CollectDiagnostics]
                      risk:
                        type: string
                        enum: [low, medium, high]
                      requireApproval:
                        type: boolean
                dryRun:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                lastSuggestion:
                  type: string
                approvalRequired:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: DryRun
          type: boolean
          jsonPath: .spec.dryRun
---
